[project]
name = "qec-sweep"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pymatching>=2.4.0",
    "stim>=1.16.0",
]

[dependency-groups]
dev = ["pre-commit>=4", "ruff>=0.9", "mypy>=1.14", "pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "CPY", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
"tools/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 30

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sweep", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["stim", "pymatching"]
ignore_missing_imports = true
