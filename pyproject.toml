[project]
name = "qec-sweep"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pymatching>=2.4.0",
    "stim>=1.16.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
    "pyarrow-stubs>=20.0.0.20260819",
    "boto3>=1.43.122",
    "boto3-stubs[ec2,sns]>=1.43.122",
    "botocore[crt]>=1.43.122",
]

[project.scripts]
sweep = "sweep.cli:main"
sweep-reduce = "sweep.reduce:main"
sweep-plot = "sweep.plot:main"
statevector = "mpi.cli:main"

[project.optional-dependencies]
mpi = [
    "mpi4py>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sweep", "mpi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D105", "D107", "COM812", "ISC001", "CPY", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "S603", "S607", "TRY003", "EM101"]
"tools/**" = ["T201", "S603", "S607"]
"sweep/cli.py" = ["T201"]
"sweep/reduce.py" = ["T201"]
"sweep/plot.py" = ["T201"]
"mpi/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 30

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sweep", "mpi", "tools", "infra", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["stim", "pymatching"]
ignore_missing_imports = true
