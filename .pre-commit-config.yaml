repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-toml
      - id: check-json
      - id: check-yaml
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # Slurm scripts end in .sbatch, which identify does not know as shell.
        types: [text]
        files: \.(sh|sbatch)$
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
      - id: commit-message
        name: commit message
        entry: uv run python tools/check_commit.py
        language: system
        stages: [commit-msg]
      - id: terraform-validate
        name: terraform validate
        # Validation gets its own data directory so it never touches the S3 backend.
        entry: >-
          bash -c 'cd infra && export TF_DATA_DIR=.terraform-validate
          && terraform init -backend=false -input=false >/dev/null && terraform validate'
        language: system
        files: ^infra/.*\.tf$
        pass_filenames: false
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
