name: image

on:
  push:
    branches: [main]
    paths: [image/**, sweep/**, mpi/**, results/**, tests/image/**, pyproject.toml, .github/workflows/image.yml]
  pull_request:
    paths: [image/**, sweep/**, mpi/**, results/**, tests/image/**, pyproject.toml, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # The sweep image is built for both architectures the cluster runs, each on a
    # runner of its own kind, from one definition: the pinned Python base is a
    # multi-architecture index and every pinned package ships both wheels.
    strategy:
      matrix:
        include:
          - {name: sweep, definition: sweep, packages: packages.txt, runs-on: ubuntu-latest}
          - {name: mpi, definition: mpi, packages: mpi-packages.txt, runs-on: ubuntu-latest}
          - {name: sweep-arm64, definition: sweep, packages: packages.txt, runs-on: ubuntu-24.04-arm}
    name: image (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own commit, not GitHub's merge of it, so the sha tag is honest.
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: registry
        run: |
          repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$repository/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: unchanged
        # An image is rebuilt only when what goes into it changed since a commit whose
        # image the registry already holds: a pull request's base, or the commit before
        # this one on main. Otherwise that image is given this commit's tag as well.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          inputs=(image/${{ matrix.definition }}.def image/${{ matrix.packages }} sweep mpi results pyproject.toml)
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" "$SHA" -- "${inputs[@]}"; then
            echo "since=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.unchanged.outputs.since != ''
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.6
      - if: steps.unchanged.outputs.since != ''
        id: retag
        # Tagging a manifest moves no bytes. A base whose image is missing falls through to a build.
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | oras login -u '${{ github.actor }}' --password-stdin ghcr.io
          tags=("$SHA")
          [ '${{ github.ref }}' = refs/heads/main ] && tags+=(latest)
          oras tag "${{ steps.registry.outputs.name }}:${{ steps.unchanged.outputs.since }}" "${tags[@]}"
      - if: steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure'
        run: uv sync && uv build --wheel
      # Apptainer's own releases carry no arm64 package; its PPA builds for both.
      - if: steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get install -y --no-install-recommends apptainer
      - if: steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure'
        run: sudo apptainer build image.sif image/${{ matrix.definition }}.def && sudo chown "$USER" image.sif
      - if: steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure'
        env:
          IMAGE: ${{ matrix.definition }}
        run: env "$(echo "$IMAGE" | tr '[:lower:]' '[:upper:]')_IMAGE=$PWD/image.sif" uv run pytest tests/image
      - if: >-
          (steps.unchanged.outputs.since == '' || steps.retag.outcome == 'failure')
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | apptainer registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          apptainer push image.sif "oras://${{ steps.registry.outputs.name }}:$SHA"
          if [ '${{ github.ref }}' = refs/heads/main ]; then
            apptainer push image.sif "oras://${{ steps.registry.outputs.name }}:latest"
          fi
