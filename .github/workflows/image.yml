name: image

on:
  push:
    branches: [main]
    paths: [image/**, sweep/**, pyproject.toml, .github/workflows/image.yml]
  pull_request:
    paths: [image/**, sweep/**, pyproject.toml, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.1
      - run: sudo apptainer build sweep.sif image/sweep.def && sudo chown "$USER" sweep.sif
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: SWEEP_IMAGE="$PWD/sweep.sif" uv run pytest tests/image
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/sweep"
          echo "$TOKEN" | apptainer registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          apptainer push sweep.sif "oras://$name:${{ github.event.pull_request.head.sha || github.sha }}"
          if [ '${{ github.ref }}' = refs/heads/main ]; then
            apptainer push sweep.sif "oras://$name:latest"
          fi
