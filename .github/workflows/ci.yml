name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
      # The MPI packages come from a cache keyed on their names, not from apt each run.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: openmpi-bin libopenmpi-dev
          version: 1.0
      - run: uv sync --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The MPI packages come from a cache keyed on their names, not from apt each run.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: openmpi-bin libopenmpi-dev
          version: 1.0
      - run: uv sync --all-extras
      - run: uv run pytest

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: >-
          uv run python tools/check_commit.py
          --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
