name: models

# A decoder is promoted by changing its noise model's manifest under models/
# through a pull request. The check follows every manifest to its run in the
# bucket, holds a learned decoder's weights to their hash, and judges each
# against the base branch's manifest for the same noise model, whatever its file
# is called, cell by cell; it refuses a candidate that is worse anywhere with the
# intervals apart or that skipped a cell, and a noise model whose decoder the
# base has and the branch withdraws. It reads the bucket from the read-only
# runner (see infra/deploy.tf).
on:
  pull_request:
    paths:
      - models/**
      - .github/workflows/models.yml

jobs:
  promote:
    runs-on: codebuild-qec-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra results
      - shell: bash
        run: |
          mkdir -p base
          git archive "origin/${{ github.base_ref }}" models | tar -x -C base
          uv run results-promote --base base/models models/*.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
