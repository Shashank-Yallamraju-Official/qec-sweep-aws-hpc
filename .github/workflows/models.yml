name: models

# A decoder is promoted by changing its noise model's manifest under models/
# through a pull request. The check follows every manifest to its run in the
# bucket, holds a learned decoder's weights to their hash, and judges each
# against the same file on the base branch cell by cell; it refuses a candidate
# that is worse anywhere with the intervals apart, or that skipped a cell. It
# reads the bucket from the read-only runner (see infra/deploy.tf).
on:
  pull_request:
    paths:
      - models/**
      - .github/workflows/models.yml

jobs:
  promote:
    runs-on: codebuild-qec-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra results
      - shell: bash
        run: |
          status=0
          for manifest in models/*.json; do
            against=()
            if git show "origin/${{ github.base_ref }}:$manifest" > current.json 2>/dev/null; then
              against=(--against current.json)
            fi
            echo "## $manifest" | tee -a "$GITHUB_STEP_SUMMARY"
            uv run results-promote "$manifest" "${against[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"
