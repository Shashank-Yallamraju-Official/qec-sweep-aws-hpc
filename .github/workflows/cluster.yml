name: cluster

# The cluster configuration is validated by ParallelCluster itself, against the
# account, on a read-only runner inside the project (see infra/deploy.tf).
on:
  pull_request:
    paths:
      - cluster/**
      - .github/workflows/cluster.yml

jobs:
  validate:
    runs-on: codebuild-qec-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      # The two launch-template validators call RunInstances in dry-run mode, which
      # still needs the RunInstances permission the read-only runner does not hold;
      # the deploy on main runs them for real. A dry run that would have succeeded
      # still exits 1, so the verdict is read from the response.
      - run: |
          uvx --from aws-parallelcluster==3.16.2 pcluster create-cluster --dryrun true \
            --cluster-name "qec-pr-${{ github.event.number }}" \
            --cluster-configuration cluster/cluster.yaml --region us-east-2 \
            --suppress-validators type:HeadNodeLaunchTemplateValidator type:ComputeResourceLaunchTemplateValidator \
            > dryrun.json || true
          jq -r '.validationMessages[]? | "\(.level) \(.type): \(.message)"' dryrun.json
          jq -e '.message == "Request would have succeeded, but DryRun flag is set."' dryrun.json

  smoke:
    # Proves a running cluster still schedules work. The runner may send one fixed
    # Systems Manager document to the head node and nothing else; with no cluster
    # up there is nothing to prove, and the job says so and passes.
    runs-on: codebuild-qec-sweep-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - id: head
        run: |
          head=$(aws ec2 describe-instances --region us-east-2 \
            --filters Name=tag:parallelcluster:cluster-name,Values=qec \
                      Name=tag:parallelcluster:node-type,Values=HeadNode \
                      Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          echo "id=$head" >> "$GITHUB_OUTPUT"
          [[ -n $head ]] || echo "no cluster is running; nothing to smoke"
      - if: steps.head.outputs.id != ''
        run: |
          command=$(aws ssm send-command --region us-east-2 --document-name qec-sweep-smoke \
            --instance-ids "${{ steps.head.outputs.id }}" --query Command.CommandId --output text)
          invocation() {
            aws ssm get-command-invocation --region us-east-2 --command-id "$command" \
              --instance-id "${{ steps.head.outputs.id }}" --query "$1" --output text 2>/dev/null
          }
          until status=$(invocation Status) && [[ $status != @(Pending|InProgress|Delayed) ]]; do sleep 15; done
          invocation '[StandardOutputContent,StandardErrorContent]'
          [[ $status == Success ]]
