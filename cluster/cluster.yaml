Region: us-east-2
Image:
  Os: ubuntu2404
Tags:
  - Key: project
    Value: qec-sweep

HeadNode:
  InstanceType: t3.medium
  Image: &x86-image
    # The image cluster/ami.yaml bakes: Apptainer and the sweep and mpi images
    # already on the disk, so a node boots straight into Slurm.
    CustomAmi: ami-0d05ec8d360c519e0
  Networking:
    # us-east-2b is the one zone here that also offers the HPC instance types.
    SubnetId: &subnet subnet-0b765c6a2d2523330
  Iam: &node-iam
    AdditionalIamPolicies:
      # Put-only on the results bucket, owned by Terraform; results outlive the cluster.
      - Policy: arn:aws:iam::523520772490:policy/qec-sweep-node-results
      # ParallelCluster does not grant Session Manager by itself; without this
      # the agent never registers and the head node is unreachable.
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    S3Access:
      # Read-only, for the configure script below.
      - BucketName: qec-sweep-results-523520772490
        KeyName: cluster/*
  CustomActions: &configure
    OnNodeConfigured:
      # Installs Apptainer and makes scratch writable; see the script.
      Script: s3://qec-sweep-results-523520772490/cluster/on-node-configured.sh

# The graphical login node from the design: one node that runs for the cluster's life,
# with Amazon DCV serving a desktop to a browser, so a scientist opens a GUI tool
# beside the queues instead of on a laptop. ParallelCluster installs DCV and the
# desktop itself; the configure script adds the tool. The session is opened without
# SSH, through Session Manager, like everything else on this cluster.
LoginNodes:
  Pools:
    - Name: login
      Count: 1
      InstanceType: t3.medium
      Image: *x86-image
      Networking:
        SubnetIds:
          - *subnet
      # The port is closed to the internet: a desktop is reached through Session
      # Manager port forwarding to localhost, by cluster/dcv-session.sh, with a
      # certificate the browser trusts, so there is no warning to click through and no
      # public port to guard. No GPU, since the account has no GPU quota; DCV renders
      # ParaView in software, enough to prove it.
      Dcv:
        Enabled: true
        AllowedIps: 172.31.0.0/16
      Iam:
        # A login pool takes no S3Access, so the read on cluster/* comes as a policy.
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::523520772490:policy/qec-sweep-node-results
          - Policy: arn:aws:iam::523520772490:policy/qec-sweep-node-cluster-files
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      CustomActions: *configure

Scheduling:
  Scheduler: slurm
  SlurmSettings:
    # The cost guardrail from the design: compute scales to zero when idle. Sweep
    # cells take seconds, so three minutes cover the gap between back-to-back runs
    # and bill a third of the ten-minute tail stage 6 measured.
    ScaledownIdletime: 3
  SlurmQueues:
    - Name: sweep
      Image: *x86-image
      ComputeResources:
        - Name: c7a
          InstanceType: c7a.large
          MinCount: 0
          # Sixteen two-vCPU nodes plus the head node fit the raised 64-vCPU quota.
          MaxCount: 16
        # A second x86 type beside the first, for cells per dollar. Every node carries
        # its instance type as a Slurm feature, so a run pins one with a constraint.
        - Name: c7i
          InstanceType: c7i.large
          MinCount: 0
          MaxCount: 16
      Networking:
        SubnetIds:
          - *subnet
      Iam: *node-iam
      CustomActions: *configure
    # Cells are idempotent and short, so an interruption costs one cell; spot
    # cuts the sweep's bill by roughly two-thirds.
    - Name: sweep-spot
      Image: *x86-image
      CapacityType: SPOT
      ComputeResources:
        - Name: c7a
          InstanceType: c7a.large
          MinCount: 0
          MaxCount: 16
      Networking:
        SubnetIds:
          - *subnet
      Iam: *node-iam
      CustomActions: *configure
    # Tightly coupled ranks: EFA carries the exchanges, one placement group keeps
    # the nodes close, and on demand because one lost rank kills the whole job.
    # hpc6a rather than hpc7a: two fifths of the price for the same scaling question.
    - Name: mpi
      Image: *x86-image
      ComputeResources:
        - Name: hpc6a
          InstanceType: hpc6a.48xlarge
          MinCount: 0
          MaxCount: 8
          Efa:
            Enabled: true
      Networking:
        # An EFA node carries a second, EFA-only interface, and EC2 gives no public IP
        # to an instance with two, so the queue lives in the private subnet that
        # infra/network.tf routes through a NAT gateway.
        SubnetIds:
          - subnet-04055e96bf1c1e771
        PlacementGroup:
          Enabled: true
      Iam: *node-iam
      CustomActions: *configure

SharedStorage:
  - Name: scratch
    StorageType: Efs
    MountDir: /scratch
    EfsSettings:
      # Bursting throughput is enough: a new file system starts with 2.1 TiB of burst
      # credit, and each node reads the image once and keeps it in its page cache.
      DeletionPolicy: Delete
