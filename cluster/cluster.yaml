Region: us-east-2
Image:
  Os: ubuntu2404
Tags:
  - Key: project
    Value: qec-sweep

HeadNode:
  InstanceType: t3.medium
  Networking:
    # us-east-2b is the one zone here that also offers hpc7a, for the MPI queue later.
    SubnetId: &subnet subnet-0b765c6a2d2523330
  Iam: &node-iam
    AdditionalIamPolicies:
      # Put-only on the results bucket, owned by Terraform; results outlive the cluster.
      - Policy: arn:aws:iam::523520772490:policy/qec-sweep-node-results
      # ParallelCluster does not grant Session Manager by itself; without this
      # the agent never registers and the head node is unreachable.
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    S3Access:
      # Read-only, for the configure script below.
      - BucketName: qec-sweep-results-523520772490
        KeyName: cluster/*
  CustomActions: &configure
    OnNodeConfigured:
      # Installs Apptainer and makes scratch writable; see the script.
      Script: s3://qec-sweep-results-523520772490/cluster/on-node-configured.sh

Scheduling:
  Scheduler: slurm
  SlurmSettings:
    # The cost guardrail from the design: compute scales to zero after ten idle minutes.
    ScaledownIdletime: 10
  SlurmQueues:
    - Name: sweep
      ComputeResources:
        - Name: c7a
          InstanceType: c7a.large
          MinCount: 0
          # Seven two-vCPU nodes plus the head node fill a new account's 16-vCPU quota.
          MaxCount: 7
      Networking:
        SubnetIds:
          - *subnet
      Iam: *node-iam
      CustomActions: *configure
    # Cells are idempotent and short, so an interruption costs one cell; spot
    # cuts the sweep's bill by roughly two-thirds.
    - Name: sweep-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: c7a
          InstanceType: c7a.large
          MinCount: 0
          MaxCount: 16
      Networking:
        SubnetIds:
          - *subnet
      Iam: *node-iam
      CustomActions: *configure

SharedStorage:
  - Name: scratch
    StorageType: Efs
    MountDir: /scratch
    EfsSettings:
      # Bursting throughput is enough: a new file system starts with 2.1 TiB of burst
      # credit, and each node reads the image once and keeps it in its page cache.
      DeletionPolicy: Delete
