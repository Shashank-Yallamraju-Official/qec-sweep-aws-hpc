<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pick two runs of the QEC decoder sweep, compare them cell by cell with confidence intervals, and trace what produced each."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Compare two runs</title>
    <script>
      // Applied before paint so a chosen theme never flashes the other one.
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
