<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pick two runs of the QEC decoder sweep, compare them cell by cell with confidence intervals, and trace what produced each."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Compare two runs</title>
    <script>
      // Applied before paint so a chosen theme never flashes the other one.
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <!-- The shell is painted from the HTML alone; the application replaces it with the same markup. -->
    <div id="app">
      <div class="page">
        <header class="masthead">
          <div class="title-row"><h1>Compare two runs</h1></div>
          <p class="standfirst">
            Pick two runs of the decoder sweep. Each cell is judged on its 95% intervals: a difference
            counts only where they do not touch. Every run traces back to the commit, image and jobs
            that produced it.
          </p>
        </header>
        <main><p class="quiet">Loading the catalogue.</p></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
